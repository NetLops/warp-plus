services:
  warp-plus:
    image: warp-plus:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8086:8086"
    command:
      - "--config=/config/warp-plus.json"
      - "--cache-dir=/var/lib/warp-plus"
      - "--bind=0.0.0.0:8086"
    volumes:
      - ./compose/config:/config:ro
      - warp-plus-cache:/var/lib/warp-plus
    environment:
      - WARP_PLUS_CACHE_DIR=/var/lib/warp-plus
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  warp-plus-cache: {}
